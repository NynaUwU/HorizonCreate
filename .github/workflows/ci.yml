name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
      - run: cargo clippy --all-targets -- -D warnings
      - run: python3 tools/check_mod.py
      - run: python3 tools/sync_native.py && git diff --exit-code native/
      - run: cargo check --manifest-path tools/api-check/adapter/Cargo.toml
      - run: python3 tools/package.py
