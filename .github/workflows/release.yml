# Push a tag like v0.1.0 and this publishes a GitHub Release with the .hmod and .hnmod.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: cargo test --workspace
      - name: Check content mod
        run: python3 tools/check_mod.py
      - name: Native engine copy is up to date
        run: python3 tools/sync_native.py && git diff --exit-code native/
      - name: Package
        run: python3 tools/package.py
      - name: Publish release
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Horizon Create $GITHUB_REF_NAME" --notes-file releases/NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
